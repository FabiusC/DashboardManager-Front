version: "3"
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBRED_IP}
services:
  front_end_dashboards_app:
    container_name: ${NAME_CONTAINER_APP}
    build: .
    env_file:
      - .env
    ports:
      - ${PORT_DEPLOY}:3030
    volumes:
      - .:/app
    restart: always
    environment:
      - WATCHPACK_POLLING=true
      - GITHUB_TOKEN=${GITHUB_TOKEN}
